# Select image from https://hub.docker.com/_/php/
image: php:latest

# Select what we should cache between builds
cache:
  paths:
    - vendor/

before_script:
  - apt-get update -yqq
  - apt-get install -yqq git libpq-dev libcurl4-gnutls-dev libicu-dev libvpx-dev libjpeg-dev libpng-dev libxpm-dev zlib1g-dev libfreetype6-dev libxml2-dev libexpat1-dev libbz2-dev libgmp3-dev libldap2-dev unixodbc-dev libsqlite3-dev libaspell-dev libsnmp-dev libpcre3-dev libtidy-dev libonig-dev libzip-dev
  # Install PHP extensions
  - docker-php-ext-install mbstring pdo_pgsql curl intl gd xml zip bz2 opcache
  # Install & enable Xdebug for code coverage reports
  - pecl install xdebug
  - docker-php-ext-enable xdebug
  # Install and run Composer
  - curl -sS https://getcomposer.org/installer | php
  - php composer.phar install

stages:          # List of stages for jobs, and their order of execution
  - test
  - build

php-compatibility-test-job:   # This job runs in the test stage.
  stage: test
  script:
    - echo "Running Php compatibility tests..."
    - php composer.phar check-php # Check if code is compatible with an actual(last) version of PHP
  only:
    - tags

prestashop-job:   # This job runs in the build stage.
  stage: build
  script:
    - echo "Running Prestashop code standarts"
    - php composer.phar autoindex #Create recursive Prestashop file index.php on module folder
    - php composer.phar copyright #Update recursive copyright notice on module folder
    - php composer.phar format    # Reformat code with PSR12 standard
  only:
    - tags

deploy-job:      # This job runs in the Build stage.
  stage: build  # It only runs when jobs in the test stage complete successfully.
  script:
    - echo "Remove Dev dependencies from vendor folder"
    - php composer.phar install --no-dev
    - echo "Building Artifact..."
    - mkdir .build
    - cp -r * .build
    - mv .build opxemployees
    - echo "Application successfully Builded."
  artifacts:
    paths:
    - opxemployees
  only:
    - tags
